<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - FoodDelivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #fafafa; }

        .navbar { background: linear-gradient(135deg, #c0392b, #e74c3c) !important; box-shadow: 0 2px 20px rgba(0,0,0,.2); }
        .navbar-brand { font-weight: 800; color: #fff !important; font-size: 1.3rem; }
        .navbar-brand span { color: #ffd166; }
        .nav-link { color: rgba(255,255,255,.85) !important; font-weight: 500; }
        .nav-link:hover { color: #ffd166 !important; }

        .page-header {
            background: linear-gradient(135deg, #c0392b, #e74c3c, #e67e22);
            padding: 40px 0 60px; color: #fff;
        }
        .page-header h1 { font-weight: 800; font-size: 2rem; }
        .breadcrumb-item a { color: rgba(255,255,255,.7); text-decoration: none; }
        .breadcrumb-item.active { color: #ffd166; }
        .breadcrumb-item + .breadcrumb-item::before { color: rgba(255,255,255,.5); }

        .orders-section { margin-top: -30px; }

        /* Stats bar */
        .stats-row { margin-bottom: 28px; }
        .stat-card {
            background: #fff; border-radius: 16px; padding: 20px 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,.06); text-align: center;
        }
        .stat-card .stat-number { font-size: 1.8rem; font-weight: 800; color: #e74c3c; }
        .stat-card .stat-label  { font-size: .8rem; color: #636e72; margin: 0; }

        /* Order card */
        .order-card {
            background: #fff; border-radius: 20px; margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,.06); overflow: hidden;
            transition: all .3s; border: 1px solid transparent;
        }
        .order-card:hover { border-color: #ffd4d0; box-shadow: 0 8px 28px rgba(0,0,0,.1); }

        .order-header {
            background: linear-gradient(90deg, #fff8f5, #fff3ef);
            padding: 16px 24px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
            border-bottom: 1px solid #ffeee8;
        }
        .order-id { font-weight: 800; color: #2d3436; font-size: 1rem; }
        .order-date { color: #636e72; font-size: .85rem; }
        .order-status { padding: 4px 14px; border-radius: 20px; font-size: .8rem; font-weight: 700; }
        .status-pending   { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d1ecf1; color: #0c5460; }
        .status-delivered { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }

        .order-body { padding: 16px 24px; }

        .order-item { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
        .order-item:last-child { border-bottom: none; }
        .order-item-name { font-weight: 600; color: #2d3436; font-size: .95rem; flex: 1; }
        .order-item-qty { color: #636e72; font-size: .85rem; white-space: nowrap; }
        .order-item-sub { font-weight: 700; color: #e74c3c; font-size: .95rem; white-space: nowrap; }

        .order-footer {
            background: #f9f9f9; padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .order-total-label { font-size: .85rem; color: #636e72; }
        .order-total-amount { font-size: 1.2rem; font-weight: 800; color: #e74c3c; }

        /* Timeline */
        .timeline { display: flex; align-items: center; gap: 0; flex-wrap: wrap; padding: 8px 0 4px; }
        .tl-step { display: flex; align-items: center; gap: 4px; font-size: .75rem; color: #b2bec3; }
        .tl-step.done { color: #27ae60; }
        .tl-step i { font-size: .7rem; }
        .tl-line { flex: 1; height: 2px; background: #f0f0f0; min-width: 20px; }
        .tl-line.done { background: #27ae60; }

        /* Pagination */
        .pagination-wrapper { display: flex; justify-content: center; margin-top: 24px; }
        .pagination .page-link { color: #e74c3c; border-color: #ffd4d0; border-radius: 8px !important; margin: 0 2px; font-weight: 600; }
        .pagination .page-item.active .page-link { background: linear-gradient(135deg,#e74c3c,#c0392b); border-color: #e74c3c; color: #fff; }
        .pagination .page-link:hover { background: #fff3f0; color: #c0392b; }

        /* Empty */
        .empty-orders { text-align: center; padding: 80px 20px; background: #fff; border-radius: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
        .empty-orders i { font-size: 5rem; color: #ffd4d0; margin-bottom: 20px; display: block; }

        /* Toast */
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; }
        .toast-success { background: linear-gradient(135deg, #00b894, #00cec9); color: #fff; border: none; border-radius: 12px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .navbar { padding: 12px 0; }
            .navbar-brand { font-size: 1.1rem; }
            .page-header { padding: 30px 0 40px; }
            .page-header h1 { font-size: 1.5rem; }
            .page-header p { font-size: 0.9rem; }
            .filter-tabs { gap: 8px; }
            .filter-btn { padding: 10px 16px; font-size: 0.9rem; }
            .order-card { padding: 16px; margin-bottom: 16px; }
            .order-header { gap: 12px; }
            .order-id { font-size: 0.9rem; }
            .order-meta { font-size: 0.85rem; }
            .order-badge { font-size: 0.8rem; padding: 6px 12px; }
            .order-items { font-size: 0.85rem; }
            .order-total { font-size: 1.1rem; }
            .order-actions { gap: 8px; }
            .btn-details { padding: 8px 16px; font-size: 0.85rem; }
            .empty-orders { padding: 60px 20px; }
            .empty-orders i { font-size: 3.5rem; }
        }

        @media (max-width: 576px) {
            .navbar-brand { font-size: 1rem; }
            .nav-link { font-size: 0.85rem; }
            .page-header { padding: 20px 0 30px; }
            .page-header h1 { font-size: 1.2rem; }
            .page-header p { font-size: 0.8rem; }
            .filter-tabs { flex-wrap: wrap; gap: 6px; }
            .filter-btn { padding: 8px 12px; font-size: 0.8rem; flex: 1; min-width: 80px; }
            .order-card { padding: 12px; margin-bottom: 12px; border-radius: 12px; }
            .order-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .order-id { font-size: 0.85rem; }
            .order-meta { font-size: 0.8rem; }
            .order-status { font-size: 0.75rem; }
            .order-badge { font-size: 0.75rem; padding: 4px 10px; }
            .order-content { font-size: 0.8rem; }
            .order-items { font-size: 0.8rem; margin: 8px 0; }
            .order-total { font-size: 1rem; margin-top: 8px; }
            .order-actions { flex-direction: column; gap: 6px; }
            .btn-details { width: 100%; padding: 10px 12px; font-size: 0.8rem; }
            .empty-orders { padding: 40px 20px; }
            .empty-orders i { font-size: 3rem; margin-bottom: 16px; }
            .empty-orders h4 { font-size: 1.1rem; }
            .empty-orders p { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-utensils me-2" style="color:#ffd166"></i>Food<span>Delivery</span></a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <a href="/" class="nav-link"><i class="fas fa-home me-1"></i>Home</a>
            <a href="/user/cart.html" class="nav-link"><i class="fas fa-shopping-cart me-1"></i>Cart</a>
            <a href="/user/profile.html" class="nav-link" id="userLabel"><i class="fas fa-user me-1"></i>Account</a>
        </div>
    </div>
</nav>

<div class="page-header">
    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active">Order History</li>
            </ol>
        </nav>
        <h1><i class="fas fa-receipt me-2"></i>Order History</h1>
    </div>
</div>

<div class="container orders-section pb-5">
    <!-- Stats -->
    <div class="row g-3 stats-row" id="statsRow" style="display:none!important">
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-number" id="statTotal">0</div>
                <p class="stat-label">Total Orders</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-number" id="statSpent">$0</div>
                <p class="stat-label">Total Spent</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-number" id="statDelivered">0</div>
                <p class="stat-label">Delivered</p>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-number" id="statPending">0</div>
                <p class="stat-label">Processing</p>
            </div>
        </div>
    </div>

    <!-- Order list -->
    <div id="orderList">
        <!-- Skeleton -->
        <div id="orderSkeleton">
            <div style="background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:20px;height:180px;margin-bottom:20px"></div>
            <div style="background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:20px;height:180px"></div>
        </div>
    </div>
    <div class="pagination-wrapper" id="paginationWrapper"></div>
</div>

<div class="toast-container">
    <div id="appToast" class="toast align-items-center toast-success" role="alert">
        <div class="d-flex">
            <div class="toast-body fw-500" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<style>
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
    const user = getCurrentUser();
    if (!user) window.location.href = '/user/login.html';
    document.getElementById('userLabel').innerHTML = `<i class="fas fa-user me-1"></i>${user?.username || 'Account'}`;

    let currentPage = 1;
    const PAGE_LIMIT = 5;

    const STATUS_MAP = {
        pending:    { cls: 'status-pending',    label: 'Pending',    icon: 'fas fa-clock' },
        processing: { cls: 'status-confirmed',  label: 'Processing', icon: 'fas fa-fire' },
        delivering: { cls: 'status-confirmed',  label: 'Delivering', icon: 'fas fa-motorcycle' },
        completed:  { cls: 'status-delivered',  label: 'Completed',  icon: 'fas fa-check-circle' },
        cancelled:  { cls: 'status-cancelled',  label: 'Cancelled',  icon: 'fas fa-times-circle' },
    };

    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleString('en-US', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
    }

    function getTimeline(status) {
        const steps = ['pending', 'processing', 'delivering', 'completed'];
        const idx = steps.indexOf(status);
        if (status === 'cancelled') {
            return `<div class="timeline"><span class="tl-step done"><i class="fas fa-receipt"></i> Ordered</span><div class="tl-line done"></div><span class="tl-step" style="color:#e74c3c"><i class="fas fa-times"></i> Cancelled</span></div>`;
        }
        return `<div class="timeline">
            <span class="tl-step ${idx>=0?'done':''}"><i class="fas fa-receipt"></i> Ordered</span>
            <div class="tl-line ${idx>=1?'done':''}"></div>
            <span class="tl-step ${idx>=1?'done':''}"><i class="fas fa-fire"></i> Processing</span>
            <div class="tl-line ${idx>=2?'done':''}"></div>
            <span class="tl-step ${idx>=2?'done':''}"><i class="fas fa-motorcycle"></i> Delivering</span>
            <div class="tl-line ${idx>=3?'done':''}"></div>
            <span class="tl-step ${idx>=3?'done':''}"><i class="fas fa-check-circle"></i> Completed</span>
        </div>`;
    }

    async function loadOrders(page = 1) {
        currentPage = page;
        try {
            const res = await fetchAPI(`/orders?page=${currentPage}&limit=${PAGE_LIMIT}`);
            document.getElementById('orderSkeleton')?.remove();

            const orders = res.items || [];
            const totalCount = res.totalCount || 0;
            const list = document.getElementById('orderList');

            if (!orders || orders.length === 0) {
                list.innerHTML = `
                    <div class="empty-orders">
                        <i class="fas fa-receipt"></i>
                        <h4 style="color:#636e72">No orders yet</h4>
                        <p class="text-muted mb-4">Start ordering and enjoy amazing food!</p>
                        <a href="/" class="btn" style="background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;border-radius:30px;padding:12px 32px;font-weight:700">
                            <i class="fas fa-utensils me-2"></i>Order Now
                        </a>
                    </div>`;
                return;
            }

            // Stats
            const statsRow = document.getElementById('statsRow');
            statsRow.style.display = '';
            document.getElementById('statTotal').textContent = totalCount;
            document.getElementById('statSpent').textContent = '$' + (res.totalPrice || 0).toFixed(2);
            document.getElementById('statDelivered').textContent = res.completedCount || 0;
            document.getElementById('statPending').textContent   = res.processingCount || 0;

            list.innerHTML = orders.map(order => {
                const st = STATUS_MAP[order.status] || STATUS_MAP['pending'];
                const itemsHtml = (order.items || []).map(item => `
                    <div class="order-item">
                        <div class="order-item-name">${item.name}</div>
                        <div class="order-item-qty">x${item.quantity}</div>
                        <div class="order-item-sub">$${item.sub_total.toFixed(2)}</div>
                    </div>`).join('');

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-id"><i class="fas fa-hashtag me-1" style="color:#e74c3c"></i>Order #${order.id}</div>
                                <div class="order-date"><i class="fas fa-clock me-1"></i>${formatDate(order.created_at)}</div>
                            </div>
                            <span class="order-status ${st.cls}"><i class="${st.icon} me-1"></i>${st.label}</span>
                        </div>
                        <div class="order-body">
                            ${getTimeline(order.status)}
                            <div class="mt-3">${itemsHtml}</div>
                        </div>
                        <div class="order-footer">
                            <span class="order-total-label"><i class="fas fa-box me-1"></i>${order.items?.length || 0} item(s)</span>
                            <div>
                                <span class="order-total-label me-2">Total:</span>
                                <span class="order-total-amount">$${order.total_price.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>`;
            }).join('');

            renderPagination(totalCount);

        } catch(e) {
            console.error('Load orders error:', e);
            document.getElementById('orderSkeleton')?.remove();
            document.getElementById('orderList').innerHTML = `
                <div class="empty-orders">
                    <i class="fas fa-exclamation-circle"></i>
                    <h4>Failed to load orders</h4>
                    <p class="text-muted">${e.message || e}</p>
                </div>`;
        }
    }

    function renderPagination(totalCount) {
        const wrapper = document.getElementById('paginationWrapper');
        const totalPages = Math.ceil(totalCount / PAGE_LIMIT);
        if (totalPages <= 1) { wrapper.innerHTML = ''; return; }

        let html = '<ul class="pagination">';
        html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <button class="page-link" onclick="loadOrders(${currentPage - 1})">‹</button></li>`;
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <button class="page-link" onclick="loadOrders(${i})">${i}</button></li>`;
        }
        html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <button class="page-link" onclick="loadOrders(${currentPage + 1})">›</button></li>`;
        html += '</ul>';
        wrapper.innerHTML = html;
    }

    loadOrders();
</script>
</body>
</html>
