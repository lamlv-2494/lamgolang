<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FoodDelivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; }

        .left-panel {
            width: 45%;
            background: linear-gradient(145deg, #c0392b 0%, #e74c3c 40%, #e67e22 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 48px; position: relative; overflow: hidden;
        }
        .left-panel::before {
            content: ''; position: absolute; top: -100px; right: -100px;
            width: 400px; height: 400px; border-radius: 50%; background: rgba(255,255,255,.08);
        }
        .left-panel::after {
            content: ''; position: absolute; bottom: -80px; left: -80px;
            width: 300px; height: 300px; border-radius: 50%; background: rgba(255,255,255,.05);
        }
        .left-content { position: relative; z-index: 2; text-align: center; }
        .brand-logo { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .brand-logo span { color: #ffd166; }
        .brand-tagline { color: rgba(255,255,255,.8); font-size: 1rem; margin-bottom: 40px; }
        .food-preview { max-width: 320px; filter: drop-shadow(0 20px 40px rgba(0,0,0,.3)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

        .feature-list { list-style: none; margin-top: 32px; }
        .feature-list li { color: rgba(255,255,255,.9); font-size: .9rem; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .feature-list li i { background: rgba(255,255,255,.2); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .8rem; flex-shrink: 0; }

        .right-panel {
            flex: 1; background: #fff; display: flex; align-items: center; justify-content: center; padding: 48px;
        }
        .form-box { width: 100%; max-width: 400px; }
        .form-box h2 { font-weight: 800; color: #2d3436; font-size: 1.8rem; }
        .form-box .subtitle { color: #636e72; font-size: .95rem; margin-bottom: 32px; }

        .form-floating label { color: #636e72; }
        .form-control {
            border: 2px solid #f0f0f0; border-radius: 12px; padding: 14px 16px;
            font-size: .95rem; transition: all .3s;
        }
        .form-control:focus { border-color: #e74c3c; box-shadow: 0 0 0 3px rgba(231,76,60,.15); outline: none; }
        .input-group-text { background: #fff3f0; border: 2px solid #f0f0f0; border-right: none; border-radius: 12px 0 0 12px; color: #e74c3c; }
        .input-group .form-control { border-left: none; border-radius: 0 12px 12px 0; }

        .btn-login {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none; border-radius: 12px; padding: 14px; font-size: 1rem;
            font-weight: 700; color: #fff; width: 100%; transition: all .3s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(231,76,60,.4); color: #fff; }
        .btn-login:disabled { opacity: .7; transform: none; }

        .divider { display: flex; align-items: center; gap: 12px; color: #b2bec3; font-size: .85rem; margin: 20px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #f0f0f0; }

        .register-link { text-align: center; color: #636e72; font-size: .9rem; }
        .register-link a { color: #e74c3c; font-weight: 600; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }

        .alert-error { background: #fff3f0; border: 1px solid #ffd4d0; color: #c0392b; border-radius: 12px; font-size: .9rem; }

        @media (max-width: 768px) {
            .left-panel { display: none; }
            .right-panel { padding: 32px 24px; }
            .form-box h2 { font-size: 1.5rem; }
            .form-box .subtitle { font-size: 0.9rem; }
            .form-control { padding: 12px 14px; font-size: 0.9rem; }
            .btn-login { padding: 12px; font-size: 0.95rem; }
            .form-label { font-size: 0.85rem; }
        }

        @media (max-width: 576px) {
            .right-panel { padding: 24px 16px; }
            .form-box { max-width: 100%; }
            .form-box h2 { font-size: 1.3rem; margin-bottom: 8px; }
            .form-box .subtitle { font-size: 0.85rem; margin-bottom: 20px; }
            .mb-3, .mb-4 { margin-bottom: 12px !important; }
            .form-control { padding: 10px 12px; font-size: 0.85rem; border-radius: 10px; }
            .input-group-text { font-size: 0.9rem; padding: 10px 12px; }
            .input-group .form-control { border-radius: 0; }
            .input-group .btn { padding: 10px 12px; }
            .btn-login { padding: 10px; font-size: 0.9rem; }
            .divider { margin: 16px 0; font-size: 0.8rem; }
            .register-link { font-size: 0.85rem; }
            .register-link a { font-size: 0.85rem; }
        }

        @media (max-width: 360px) {
            .right-panel { padding: 16px 12px; }
            .form-box h2 { font-size: 1.1rem; }
            .form-box .subtitle { font-size: 0.75rem; }
            .form-control { padding: 8px 10px; font-size: 0.8rem; }
            .btn-login { padding: 8px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="left-panel">
    <div class="left-content">
        <div class="brand-logo"><i class="fas fa-utensils me-2"></i>Food<span>Delivery</span></div>
        <p class="brand-tagline">Order great food, delivered to you</p>
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400&q=80" class="food-preview img-fluid" alt="Food">
        <ul class="feature-list">
            <li><i class="fas fa-bolt"></i>Fast delivery in 30 minutes</li>
            <li><i class="fas fa-star"></i>500+ quality dishes</li>
            <li><i class="fas fa-shield-alt"></i>Safe & secure payments</li>
        </ul>
    </div>
</div>

<div class="right-panel">
    <div class="form-box">
        <a href="/" class="text-muted text-decoration-none small mb-4 d-block"><i class="fas fa-arrow-left me-1"></i>Back to Home</a>
        <h2>Welcome back!</h2>
        <p class="subtitle">Sign in to order your favourite meals</p>

        <div id="errorMsg" class="alert alert-error d-none mb-3" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-600 small text-muted">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control" placeholder="email@example.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-600 small text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="btn" style="border:2px solid #f0f0f0;border-left:none;border-radius:0 12px 12px 0;background:#fff;color:#636e72" onclick="togglePwd()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
                <i class="fas fa-sign-in-alt me-2" id="loginIcon"></i>Sign In
            </button>
        </form>

        <div class="divider">or</div>

        <div class="register-link">
            Don't have an account? <a href="/user/register.html">Sign up now</a>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
    // Redirect if already logged in
    if (getCurrentUser()) window.location.href = '/';

    function togglePwd() {
        const input = document.getElementById('password');
        const icon  = document.getElementById('eyeIcon');
        if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
        else { input.type = 'password'; icon.className = 'fas fa-eye'; }
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email    = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('errorMsg');
        const btn      = document.getElementById('loginBtn');
        const spinner  = document.getElementById('loginSpinner');
        const icon     = document.getElementById('loginIcon');

        btn.disabled = true;
        spinner.classList.remove('d-none');
        icon.classList.add('d-none');
        errorBox.classList.add('d-none');

        try {
            const res = await fetchAPI('/user/login', 'POST', { email, password });
            const user = res.user;
            if (!user) throw new Error('Invalid response from server');
            loginSuccess(user.token, user);

            if (user.role === 'admin') {
                window.location.href = '/admin/categories.html';
            } else {
                window.location.href = '/';
            }
        } catch (err) {
            errorBox.textContent = err.message || 'Invalid email or password';
            errorBox.classList.remove('d-none');
            btn.disabled = false;
            spinner.classList.add('d-none');
            icon.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
