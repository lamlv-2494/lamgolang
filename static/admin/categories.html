<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #fafafa; min-height: 100vh; }

        /* Navbar */
        .navbar { background: linear-gradient(135deg, #c0392b, #e74c3c) !important; box-shadow: 0 2px 20px rgba(0,0,0,.2); }
        .navbar-brand { font-weight: 800; color: #fff !important; font-size: 1.2rem; }
        .navbar-brand i { color: #ffd166; }
        .btn-logout { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; font-weight: 600; transition: all .3s; }
        .btn-logout:hover { background: rgba(255,255,255,.3); color: #ffd166; }

        /* Admin container */
        .admin-container { margin-top: 20px; margin-bottom: 40px; }

        /* Sidebar */
        .admin-sidebar { margin-bottom: 24px; }
        .admin-nav { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.06); overflow: hidden; }
        .admin-nav a { 
            display: flex; align-items: center; gap: 12px;
            padding: 14px 18px; border: none; color: #636e72; font-weight: 500;
            border-left: 4px solid transparent; transition: all .25s; font-size: .95rem;
        }
        .admin-nav a:hover { 
            background: #f9f9f9; color: #e74c3c; border-left-color: #e74c3c;
        }
        .admin-nav a.active { 
            background: linear-gradient(135deg, #fff8f5, #fff3ef); color: #e74c3c;
            border-left-color: #e74c3c; font-weight: 700;
        }
        .admin-nav a i { width: 20px; text-align: center; }

        /* Main card */
        .admin-card { background: #fff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.08); overflow: hidden; }
        .admin-card-header { 
            background: linear-gradient(135deg, #fff8f5, #fff3ef); 
            padding: 24px; border-bottom: 2px solid #f0f0f0;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
        }
        .admin-card-header h5 { font-weight: 700; color: #2d3436; margin: 0; font-size: 1.1rem; }
        .btn-add { 
            background: linear-gradient(135deg, #e74c3c, #c0392b); border: none;
            border-radius: 10px; color: #fff; font-weight: 600; padding: 10px 20px; 
            transition: all .3s; font-size: .9rem;
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(231,76,60,.3); color: #fff; }
        .btn-add i { margin-right: 6px; }

        /* Table */
        .admin-card-body { padding: 0; }
        .table-wrapper { overflow-x: auto; }
        .admin-table { margin: 0; }
        .admin-table thead th { 
            background: #f9f9f9; font-weight: 700; color: #636e72; border-bottom: 2px solid #f0f0f0;
            padding: 16px; font-size: .9rem;
        }
        .admin-table tbody td { 
            padding: 14px 16px; border-bottom: 1px solid #f0f0f0; color: #636e72;
        }
        .admin-table tbody tr:hover { background: #f9f9f9; }
        .admin-table img { border-radius: 8px; }

        .badge-category { background: #fff3f0; color: #e74c3c; border: 1px solid #ffd4d0; border-radius: 8px; padding: 4px 10px; }
        .price-text { font-weight: 700; color: #00b894; }
        .rating-text { color: #f39c12; }

        /* Actions */
        .btn-delete { 
            background: none; border: 1px solid #e74c3c; color: #e74c3c;
            border-radius: 8px; padding: 6px 14px; font-size: .85rem; font-weight: 600;
            transition: all .2s;
        }
        .btn-delete:hover { background: #e74c3c; color: #fff; }

        /* Pagination */
        .pagination-wrapper { 
            padding: 20px 24px; background: #f9f9f9; 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
        }
        .pagination-info { color: #636e72; font-size: .9rem; }

        /* Modal */
        .modal-content { border-radius: 20px; border: none; }
        .modal-header { border-bottom: 2px solid #f0f0f0; padding: 24px; }
        .modal-header .btn-close { filter: opacity(.5); }
        .modal-title { font-weight: 700; color: #2d3436; }
        .modal-body { padding: 24px; }
        .form-label { font-weight: 600; color: #636e72; font-size: .9rem; margin-bottom: 8px; }
        .form-control, .form-select { 
            border: 2px solid #f0f0f0; border-radius: 10px; padding: 10px 14px;
            font-size: .9rem; transition: all .2s;
        }
        .form-control:focus, .form-select:focus { 
            border-color: #e74c3c; box-shadow: 0 0 0 3px rgba(231,76,60,.1); outline: none;
        }
        .modal-footer { border-top: 2px solid #f0f0f0; padding: 20px 24px; }
        .btn-modal-cancel { background: #f0f0f0; border: none; color: #636e72; border-radius: 10px; font-weight: 600; }
        .btn-modal-cancel:hover { background: #e0e0e0; color: #2d3436; }
        .btn-modal-submit { 
            background: linear-gradient(135deg, #e74c3c, #c0392b); border: none;
            color: #fff; border-radius: 10px; font-weight: 600;
        }
        .btn-modal-submit:hover { color: #fff; opacity: .9; }

        /* Error alert */
        .alert-error { background: #fff3f0; border: 1px solid #ffd4d0; color: #c0392b; border-radius: 10px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .navbar { padding: 12px 0; }
            .navbar-brand { font-size: 1rem; }
            .btn-logout { font-size: .85rem; padding: 6px 12px; }

            .admin-container { margin-top: 12px; }
            .admin-nav a { padding: 12px 14px; font-size: .9rem; }
            .admin-card-header { padding: 16px; gap: 8px; }
            .admin-card-header h5 { font-size: 1rem; }
            .btn-add { font-size: .85rem; padding: 8px 16px; }
            .btn-add i { margin-right: 4px; }

            .admin-table thead th, .admin-table tbody td { padding: 12px; font-size: .85rem; }
            .admin-table img { width: 40px !important; height: 40px !important; }
            
            .pagination-wrapper { padding: 16px; flex-direction: column; }
            .pagination-info { font-size: .8rem; }

            .btn-delete { padding: 5px 10px; font-size: .8rem; }
            .badge-category { font-size: .8rem; padding: 3px 8px; }
        }

        @media (max-width: 576px) {
            .navbar-brand { font-size: .9rem; }
            .btn-logout { font-size: .75rem; padding: 5px 10px; }

            .admin-card-header { padding: 12px; }
            .admin-card-header h5 { font-size: .9rem; }
            .btn-add { font-size: .8rem; padding: 6px 12px; }

            .admin-table thead { display: none; }
            .admin-table tbody, .admin-table tr, .admin-table td { display: block; width: 100%; }
            .admin-table tr { margin-bottom: 16px; border: 1px solid #f0f0f0; border-radius: 10px; overflow: hidden; }
            .admin-table td { 
                display: flex; justify-content: space-between; align-items: center;
                padding: 8px 12px; border-bottom: 1px solid #f0f0f0;
            }
            .admin-table td:first-child { font-weight: 700; color: #2d3436; }
            .admin-table td::before { content: attr(data-label); font-weight: 600; color: #636e72; }
            .admin-table img { width: 50px !important; height: 50px !important; }

            .pagination-wrapper { padding: 12px; }
            .modal-content { border-radius: 16px; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="fas fa-utensils me-2"></i>Admin Panel</span>
            <button class="btn btn-logout btn-sm ms-auto" onclick="adminLogout()"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
        </div>
    </nav>

    <div class="container admin-container">
        <div class="row">
            <div class="col-md-3 admin-sidebar">
                <div class="admin-nav">
                    <a href="categories.html" class="active"><i class="fas fa-list"></i>Manage Categories</a>
                    <a href="products.html"><i class="fas fa-box"></i>Manage Products</a>
                    <a href="orders.html"><i class="fas fa-receipt"></i>Manage Orders</a>
                    <a href="users.html"><i class="fas fa-users"></i>Manage Users</a>
                    <a href="suggestions.html"><i class="fas fa-lightbulb"></i>Suggestions</a>
                </div>
            </div>

            <div class="col-md-9">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h5>Category List</h5>
                        <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#createModal">
                            <i class="fas fa-plus"></i>Add New Category
                        </button>
                    </div>
                    <div class="admin-card-body">
                        <div class="table-wrapper">
                            <table class="table admin-table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Description</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="categoryTableBody">
                                    </tbody>
                            </table>
                        </div>

                        <div class="pagination-wrapper">
                            <span class="pagination-info" id="paginationInfo">Showing 0 of 0 items</span>
                            <ul class="pagination pagination-sm mb-0" id="paginationControls">
                                </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="createError" class="alert alert-error d-none"></div>
                    <form id="createCategoryForm">
                        <div class="mb-3">
                            <label class="form-label">Category Name</label>
                            <input type="text" id="createName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="createDesc" class="form-control" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-modal-cancel" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-modal-submit" onclick="document.getElementById('createCategoryForm').dispatchEvent(new Event('submit'))">
                        <i class="fas fa-save me-1"></i>Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Secure page access by ensuring logged-in user is an Admin
        requireAdmin();

        let currentPage = 1;
        const pageLimit = 5; // Define maximum items to fetch per page

        // Load data on window initialization
        window.addEventListener('DOMContentLoaded', () => loadCategories(currentPage));

        // Fetch and render paginated category lists
        async function loadCategories(page) {
            currentPage = page;
            try {
                // Call public GET route with current pagination limits
                const response = await fetchAPI(`/categories?page=${page}&limit=${pageLimit}`, 'GET');
                
                // Grounded extraction matching your Go Generic ListResponse structure ({items, totalCount})
                const categories = response.items || [];
                const totalCount = response.totalCount || 0;

                renderTable(categories);
                renderPagination(totalCount);
            } catch (error) {
                alert('Failed to load categories: ' + error.message);
            }
        }

        // Render table rows dynamically
        function renderTable(categories) {
            const tbody = document.getElementById('categoryTableBody');
            tbody.innerHTML = '';

            if (categories.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4"><i class="fas fa-inbox me-2"></i>No categories found.</td></tr>`;
                return;
            }

            categories.forEach(cat => {
                const row = `
                    <tr>
                        <td><strong>#${cat.id}</strong></td>
                        <td><span class="badge-category">${cat.name}</span></td>
                        <td class="text-truncate" style="max-width: 300px;">${cat.description || 'N/A'}</td>
                        <td class="text-end">
                            <button class="btn btn-delete" onclick="deleteCategory(${cat.id})"><i class="fas fa-trash me-1"></i>Delete</button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        // Render reactive pagination button controls
        function renderPagination(totalCount) {
            const info = document.getElementById('paginationInfo');
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = '';

            const totalPages = Math.ceil(totalCount / pageLimit);
            info.textContent = `Showing page ${currentPage} of ${totalPages || 1} (Total: ${totalCount} entries)`;

            if (totalPages <= 1) return;

            // Generate button triggers for pages
            for (let i = 1; i <= totalPages; i++) {
                const activeClass = i === currentPage ? 'active' : '';
                const li = `
                    <li class="page-item ${activeClass}">
                        <button class="page-link" onclick="loadCategories(${i})">${i}</button>
                    </li>
                `;
                controls.insertAdjacentHTML('beforeend', li);
            }
        }

        // Handle Form Submit Event for creating a new category
        document.getElementById('createCategoryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('createName').value;
            const description = document.getElementById('createDesc').value;
            const errorBox = document.getElementById('createError');

            try {
                // Submit payload via protected admin route group
                await fetchAPI('/admin/categories', 'POST', { name, description });
                
                // Hide modal and refresh current data view on success
                const modalEl = document.getElementById('createModal');
                const modalInstance = bootstrap.Modal.getInstance(modalEl);
                modalInstance.hide();
                this.reset();
                errorBox.classList.add('d-none');
                loadCategories(currentPage);
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.remove('d-none');
            }
        });

        // Handle safe removal actions for categories
        async function deleteCategory(id) {
            if (!confirm('Are you absolutely sure you want to delete this category?')) return;
            try {
                await fetchAPI(`/admin/categories/${id}`, 'DELETE');
                loadCategories(currentPage);
            } catch (error) {
                alert('Deletion failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
