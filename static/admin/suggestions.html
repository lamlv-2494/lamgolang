<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Suggestions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #fafafa; min-height: 100vh; }
        .navbar { background: linear-gradient(135deg, #c0392b, #e74c3c) !important; box-shadow: 0 2px 20px rgba(0,0,0,.2); }
        .navbar-brand { font-weight: 800; color: #fff !important; font-size: 1.2rem; }
        .navbar-brand i { color: #ffd166; }
        .btn-logout { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; font-weight: 600; transition: all .3s; }
        .btn-logout:hover { background: rgba(255,255,255,.3); color: #ffd166; }
        .admin-container { margin-top: 20px; margin-bottom: 40px; }
        .admin-sidebar { margin-bottom: 24px; }
        .admin-nav { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.06); overflow: hidden; }
        .admin-nav a { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: none; color: #636e72; font-weight: 500; border-left: 4px solid transparent; transition: all .25s; font-size: .95rem; }
        .admin-nav a:hover { background: #f9f9f9; color: #e74c3c; border-left-color: #e74c3c; }
        .admin-nav a.active { background: linear-gradient(135deg, #fff8f5, #fff3ef); color: #e74c3c; border-left-color: #e74c3c; font-weight: 700; }
        .admin-nav a i { width: 20px; text-align: center; }
        .admin-card { background: #fff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.08); overflow: hidden; }
        .admin-card-header { background: linear-gradient(135deg, #fff8f5, #fff3ef); padding: 24px; border-bottom: 2px solid #f0f0f0; }
        .admin-card-header h5 { font-weight: 700; color: #2d3436; margin: 0; font-size: 1.1rem; }
        .admin-card-body { padding: 24px; }
        .suggestion-card { background: #fff8f5; border: 1px solid #ffd4d0; border-radius: 12px; padding: 16px; margin-bottom: 12px; transition: all .2s; }
        .suggestion-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.06); border-color: #e74c3c; }
        .suggestion-text { color: #636e72; font-size: .9rem; line-height: 1.5; }
        .suggestion-meta { font-size: .8rem; color: #b2bec3; margin-top: 10px; }
        .btn-delete { background: none; border: 1px solid #e74c3c; color: #e74c3c; border-radius: 8px; padding: 6px 14px; font-size: .85rem; font-weight: 600; transition: all .2s; }
        .btn-delete:hover { background: #e74c3c; color: #fff; }
        .pagination-wrapper { padding: 20px 24px; background: #f9f9f9; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .pagination-info { color: #636e72; font-size: .9rem; }
        @media (max-width: 768px) {
            .navbar { padding: 12px 0; }
            .navbar-brand { font-size: 1rem; }
            .admin-container { margin-top: 12px; }
            .admin-nav a { padding: 12px 14px; font-size: .9rem; }
            .admin-card-header { padding: 16px; }
            .admin-card-header h5 { font-size: 1rem; }
            .admin-card-body { padding: 16px; }
            .pagination-wrapper { padding: 16px; flex-direction: column; }
            .pagination-info { font-size: .8rem; }
        }
        @media (max-width: 576px) {
            .navbar-brand { font-size: .9rem; }
            .admin-card-header { padding: 12px; }
            .admin-card-header h5 { font-size: .9rem; }
            .suggestion-card { padding: 12px; }
            .pagination-wrapper { padding: 12px; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="fas fa-utensils me-2"></i>Admin Panel</span>
            <button class="btn btn-logout btn-sm ms-auto" onclick="adminLogout()"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
        </div>
    </nav>

    <div class="container admin-container">
        <div class="row">
            <div class="col-md-3 admin-sidebar">
                <div class="admin-nav">
                    <a href="categories.html"><i class="fas fa-list"></i>Manage Categories</a>
                    <a href="products.html"><i class="fas fa-box"></i>Manage Products</a>
                    <a href="orders.html"><i class="fas fa-receipt"></i>Manage Orders</a>
                    <a href="users.html"><i class="fas fa-users"></i>Manage Users</a>
                    <a href="suggestions.html" class="active"><i class="fas fa-lightbulb"></i>Suggestions</a>
                </div>
            </div>

            <div class="col-md-9">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h5>User Feedback & Suggestions Inbox</h5>
                    </div>
                    <div class="admin-card-body">
                        <div id="suggestionsInbox"></div>

                        <div class="pagination-wrapper">
                            <span class="pagination-info" id="paginationInfo">Showing 0 of 0 items</span>
                            <ul class="pagination pagination-sm mb-0" id="paginationControls">
                                </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Enforce strict token scope role check before loading view context
        requireAdmin();

        let currentPage = 1;
        const pageLimit = 4; // Fetch 4 feedback cards per page layout

        // Initialize view data on load state
        window.addEventListener('DOMContentLoaded', () => loadSuggestions(currentPage));

        // Pull paginated user recommendations from Backend server
        async function loadSuggestions(page) {
            currentPage = page;
            try {
                // Execute secure route passing current limit controls
                const response = await fetchAPI(`/admin/suggestions?page=${page}&limit=${pageLimit}`, 'GET');
                
                // Unpack structure exactly matching your Go Generic ListResponse tags
                const suggestions = response.items || [];
                const totalCount = response.totalCount || 0;

                renderCards(suggestions);
                renderPagination(totalCount);
            } catch (error) {
                alert('Failed to load system suggestions: ' + error.message);
            }
        }

        // Render card components utilizing data matching responses.SuggestionData fields
        function renderCards(suggestions) {
            const container = document.getElementById('suggestionsInbox');
            container.innerHTML = '';

            if (suggestions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div><i class="fas fa-inbox"></i></div>
                        <p class="mb-1"><strong>Your inbox is empty!</strong></p>
                        <small>No user suggestions have been submitted yet.</small>
                    </div>
                `;
                return;
            }

            suggestions.forEach(sug => {
                const card = `
                    <div class="suggestion-card">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h6 class="fw-700 mb-0 text-dark">${sug.title || 'Suggestion'}</h6>
                            <small class="suggestion-meta">${new Date(sug.created_at).toLocaleString()}</small>
                        </div>
                        <p class="suggestion-text mb-3" style="white-space: pre-wrap;">${sug.description}</p>
                        <div class="suggestion-meta d-flex gap-3 mb-3">
                            <span><i class="fas fa-user me-1"></i><strong>${sug.username}</strong></span>
                            <span><i class="fas fa-envelope me-1"></i><a href="mailto:${sug.email}" class="text-muted text-decoration-none">${sug.email}</a></span>
                        </div>
                        <button class="btn btn-delete btn-sm" onclick="deleteSuggestion(${sug.id})"><i class="fas fa-trash me-1"></i>Delete</button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        // Compute and map responsive page triggers
        function renderPagination(totalCount) {
            const info = document.getElementById('paginationInfo');
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = '';

            const totalPages = Math.ceil(totalCount / pageLimit);
            info.textContent = `Showing page ${currentPage} of ${totalPages || 1} (Total: ${totalCount} feedback entries)`;

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const activeClass = i === currentPage ? 'active' : '';
                const li = `
                    <li class="page-item ${activeClass}">
                        <button class="page-link" onclick="loadSuggestions(${i})">${i}</button>
                    </li>
                `;
                controls.insertAdjacentHTML('beforeend', li);
            }
        }
    </script>
</body>
</html>
