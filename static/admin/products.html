<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #fafafa; min-height: 100vh; }

        /* Navbar */
        .navbar { background: linear-gradient(135deg, #c0392b, #e74c3c) !important; box-shadow: 0 2px 20px rgba(0,0,0,.2); }
        .navbar-brand { font-weight: 800; color: #fff !important; font-size: 1.2rem; }
        .navbar-brand i { color: #ffd166; }
        .btn-logout { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; font-weight: 600; transition: all .3s; }
        .btn-logout:hover { background: rgba(255,255,255,.3); color: #ffd166; }

        /* Admin container */
        .admin-container { margin-top: 20px; margin-bottom: 40px; }

        /* Sidebar */
        .admin-sidebar { margin-bottom: 24px; }
        .admin-nav { background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.06); overflow: hidden; }
        .admin-nav a { 
            display: flex; align-items: center; gap: 12px;
            padding: 14px 18px; border: none; color: #636e72; font-weight: 500;
            border-left: 4px solid transparent; transition: all .25s; font-size: .95rem;
        }
        .admin-nav a:hover { 
            background: #f9f9f9; color: #e74c3c; border-left-color: #e74c3c;
        }
        .admin-nav a.active { 
            background: linear-gradient(135deg, #fff8f5, #fff3ef); color: #e74c3c;
            border-left-color: #e74c3c; font-weight: 700;
        }
        .admin-nav a i { width: 20px; text-align: center; }

        /* Main card */
        .admin-card { background: #fff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.08); overflow: hidden; }
        .admin-card-header { 
            background: linear-gradient(135deg, #fff8f5, #fff3ef); 
            padding: 24px; border-bottom: 2px solid #f0f0f0;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
        }
        .admin-card-header h5 { font-weight: 700; color: #2d3436; margin: 0; font-size: 1.1rem; }
        .btn-add { 
            background: linear-gradient(135deg, #e74c3c, #c0392b); border: none;
            border-radius: 10px; color: #fff; font-weight: 600; padding: 10px 20px; 
            transition: all .3s; font-size: .9rem;
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(231,76,60,.3); color: #fff; }
        .btn-add i { margin-right: 6px; }

        /* Table */
        .admin-card-body { padding: 0; }
        .table-wrapper { overflow-x: auto; }
        .admin-table { margin: 0; }
        .admin-table thead th { 
            background: #f9f9f9; font-weight: 700; color: #636e72; border-bottom: 2px solid #f0f0f0;
            padding: 16px; font-size: .9rem;
        }
        .admin-table tbody td { 
            padding: 14px 16px; border-bottom: 1px solid #f0f0f0; color: #636e72;
        }
        .admin-table tbody tr:hover { background: #f9f9f9; }
        .admin-table img { border-radius: 8px; }

        .badge-category { background: #fff3f0; color: #e74c3c; border: 1px solid #ffd4d0; border-radius: 8px; padding: 4px 10px; }
        .price-text { font-weight: 700; color: #00b894; }
        .rating-text { color: #f39c12; }

        /* Actions */
        .btn-delete { 
            background: none; border: 1px solid #e74c3c; color: #e74c3c;
            border-radius: 8px; padding: 6px 14px; font-size: .85rem; font-weight: 600;
            transition: all .2s;
        }
        .btn-delete:hover { background: #e74c3c; color: #fff; }
        .btn-edit {
            background: none; border: 1px solid #3498db; color: #3498db;
            border-radius: 8px; padding: 6px 14px; font-size: .85rem; font-weight: 600;
            transition: all .2s; margin-right: 6px;
        }
        .btn-edit:hover { background: #3498db; color: #fff; }

        /* Pagination */
        .pagination-wrapper { 
            padding: 20px 24px; background: #f9f9f9; 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
        }
        .pagination-info { color: #636e72; font-size: .9rem; }

        /* Modal */
        .modal-content { border-radius: 20px; border: none; }
        .modal-header { border-bottom: 2px solid #f0f0f0; padding: 24px; }
        .modal-header .btn-close { filter: opacity(.5); }
        .modal-title { font-weight: 700; color: #2d3436; }
        .modal-body { padding: 24px; }
        .form-label { font-weight: 600; color: #636e72; font-size: .9rem; margin-bottom: 8px; }
        .form-control, .form-select { 
            border: 2px solid #f0f0f0; border-radius: 10px; padding: 10px 14px;
            font-size: .9rem; transition: all .2s;
        }
        .form-control:focus, .form-select:focus { 
            border-color: #e74c3c; box-shadow: 0 0 0 3px rgba(231,76,60,.1); outline: none;
        }
        .modal-footer { border-top: 2px solid #f0f0f0; padding: 20px 24px; }
        .btn-modal-cancel { background: #f0f0f0; border: none; color: #636e72; border-radius: 10px; font-weight: 600; }
        .btn-modal-cancel:hover { background: #e0e0e0; color: #2d3436; }
        .btn-modal-submit { 
            background: linear-gradient(135deg, #e74c3c, #c0392b); border: none;
            color: #fff; border-radius: 10px; font-weight: 600;
        }
        .btn-modal-submit:hover { color: #fff; opacity: .9; }

        /* Error alert */
        .alert-error { background: #fff3f0; border: 1px solid #ffd4d0; color: #c0392b; border-radius: 10px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .navbar { padding: 12px 0; }
            .navbar-brand { font-size: 1rem; }
            .btn-logout { font-size: .85rem; padding: 6px 12px; }

            .admin-container { margin-top: 12px; }
            .admin-nav a { padding: 12px 14px; font-size: .9rem; }
            .admin-card-header { padding: 16px; gap: 8px; }
            .admin-card-header h5 { font-size: 1rem; }
            .btn-add { font-size: .85rem; padding: 8px 16px; }
            .btn-add i { margin-right: 4px; }

            .admin-table thead th, .admin-table tbody td { padding: 12px; font-size: .85rem; }
            .admin-table img { width: 40px !important; height: 40px !important; }
            
            .pagination-wrapper { padding: 16px; flex-direction: column; }
            .pagination-info { font-size: .8rem; }

            .btn-delete { padding: 5px 10px; font-size: .8rem; }
            .badge-category { font-size: .8rem; padding: 3px 8px; }
        }

        @media (max-width: 576px) {
            .navbar-brand { font-size: .9rem; }
            .btn-logout { font-size: .75rem; padding: 5px 10px; }

            .admin-card-header { padding: 12px; }
            .admin-card-header h5 { font-size: .9rem; }
            .btn-add { font-size: .8rem; padding: 6px 12px; }

            .admin-table thead { display: none; }
            .admin-table tbody, .admin-table tr, .admin-table td { display: block; width: 100%; }
            .admin-table tr { margin-bottom: 16px; border: 1px solid #f0f0f0; border-radius: 10px; overflow: hidden; }
            .admin-table td { 
                display: flex; justify-content: space-between; align-items: center;
                padding: 8px 12px; border-bottom: 1px solid #f0f0f0;
            }
            .admin-table td:first-child { font-weight: 700; color: #2d3436; }
            .admin-table td::before { content: attr(data-label); font-weight: 600; color: #636e72; }
            .admin-table img { width: 50px !important; height: 50px !important; }

            .pagination-wrapper { padding: 12px; }
            .modal-content { border-radius: 16px; }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="fas fa-utensils me-2"></i>Admin Panel</span>
            <button class="btn btn-logout btn-sm ms-auto" onclick="adminLogout()"><i class="fas fa-sign-out-alt me-1"></i>Logout</button>
        </div>
    </nav>

    <div class="container admin-container">
        <div class="row">
            <div class="col-md-3 admin-sidebar">
                <div class="admin-nav">
                    <a href="categories.html"><i class="fas fa-list"></i>Manage Categories</a>
                    <a href="products.html" class="active"><i class="fas fa-box"></i>Manage Products</a>
                    <a href="orders.html"><i class="fas fa-receipt"></i>Manage Orders</a>
                    <a href="users.html"><i class="fas fa-users"></i>Manage Users</a>
                    <a href="suggestions.html"><i class="fas fa-lightbulb"></i>Suggestions</a>
                </div>
            </div>

            <div class="col-md-9">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h5>Product Catalog</h5>
                        <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#createProductModal" onclick="populateCategoryDropdown()">
                            <i class="fas fa-plus"></i>Add New Product
                        </button>
                    </div>
                    <div class="admin-card-body">
                        <div class="table-wrapper">
                            <table class="table admin-table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Category</th>
                                        <th>Price</th>
                                        <th>Rating</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="productTableBody">
                                    </tbody>
                            </table>
                        </div>

                        <div class="pagination-wrapper">
                            <span class="pagination-info" id="paginationInfo">Showing 0 of 0 items</span>
                            <ul class="pagination pagination-sm mb-0" id="paginationControls">
                                </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="createError" class="alert alert-error d-none"></div>
                    
                    <form id="createProductForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" id="createName" class="form-control" required placeholder="e.g., Spicy Chicken Burger">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select id="createCategorySelect" class="form-select" required>
                                <option value="">-- Select a Category --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price ($)</label>
                            <input type="number" step="0.01" id="createPrice" class="form-control" required placeholder="0.00">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="createDesc" class="form-control" rows="2" placeholder="Brief details about the item..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Image File</label>
                            <input type="file" id="createImageFile" class="form-control" accept="image/*" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-modal-cancel" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-modal-submit" onclick="document.getElementById('createProductForm').dispatchEvent(new Event('submit'))">
                        <i class="fas fa-cloud-upload-alt me-1"></i>Upload & Save
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Product Modal -->
    <div class="modal fade" id="editProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="editError" class="alert alert-error d-none"></div>
                    <form id="editProductForm" enctype="multipart/form-data">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" id="editName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select id="editCategorySelect" class="form-select" required>
                                <option value="">-- Select a Category --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price ($)</label>
                            <input type="number" step="0.01" id="editPrice" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="editDesc" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Image <small class="text-muted fw-normal">(optional — leave blank to keep current)</small></label>
                            <input type="file" id="editImageFile" class="form-control" accept="image/*">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-modal-cancel" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-modal-submit" onclick="document.getElementById('editProductForm').dispatchEvent(new Event('submit'))">
                        <i class="fas fa-save me-1"></i>Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Enforce admin strict token access control check
        requireAdmin();

        let currentPage = 1;
        const pageLimit = 5;

        // Initialize state lists on page load
        window.addEventListener('DOMContentLoaded', () => loadProducts(currentPage));

        // Pull and bind paginated product catalog arrays
        async function loadProducts(page) {
            currentPage = page;
            try {
                // Fetch using your public GET route matching custom query params
                const response = await fetchAPI(`/products?page=${page}&limit=${pageLimit}`, 'GET');
                
                // Read exact properties matching your ListResponse structure
                const products = response.items || [];
                const totalCount = response.totalCount || 0;

                renderTable(products);
                renderPagination(totalCount);
            } catch (error) {
                alert('Failed to load products: ' + error.message);
            }
        }

        // Inject database records inside DOM element row cells
        function renderTable(products) {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';

            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4"><i class="fas fa-inbox me-2"></i>No products found in catalog.</td></tr>`;
                return;
            }

            products.forEach(prod => {
                // Gracefully fallback to blank default image if asset path is completely unpopulated
                const imgSrc = prod.image ? prod.image : 'https://placehold.co/50';
                
                const row = `
                    <tr>
                        <td><strong>#${prod.id}</strong></td>
                        <td>
                            <img src="${imgSrc}" alt="${prod.name}" class="rounded" style="width: 50px; height: 50px; object-fit: cover;">
                        </td>
                        <td><span class="fw-semibold">${prod.name}</span></td>
                        <td><span class="badge-category">${prod.category.name}</span></td>
                        <td><span class="price-text">$${prod.price.toFixed(2)}</span></td>
                        <td><span class="rating-text">★ ${prod.rating ? prod.rating.toFixed(1) : '0.0'}</span></td>
                        <td class="text-end">
                            <button class="btn btn-edit" onclick="openEditProduct(${prod.id}, \`${prod.name}\`, ${prod.category.id}, ${prod.price}, \`${prod.description || ''}\`)"><i class="fas fa-pen me-1"></i>Edit</button>
                            <button class="btn btn-delete" onclick="deleteProduct(${prod.id})"><i class="fas fa-trash me-1"></i>Delete</button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        // Dynamically compute and inject page button triggers
        function renderPagination(totalCount) {
            const info = document.getElementById('paginationInfo');
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = '';

            const totalPages = Math.ceil(totalCount / pageLimit);
            info.textContent = `Showing page ${currentPage} of ${totalPages || 1} (Total: ${totalCount} items)`;

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const activeClass = i === currentPage ? 'active' : '';
                const li = `
                    <li class="page-item ${activeClass}">
                        <button class="page-link" onclick="loadProducts(${i})">${i}</button>
                    </li>
                `;
                controls.insertAdjacentHTML('beforeend', li);
            }
        }

        // Lazy load all active categories to populate the model select wrapper menu
        async function populateCategoryDropdown() {
            const select = document.getElementById('createCategorySelect');
            // Fetch with large limit bound to safely retrieve all choices bypassing page splitting
            try {
                const response = await fetchAPI('/categories?page=1&limit=100', 'GET');
                const categories = response.items || [];
                
                select.innerHTML = '<option value="">-- Select a Category --</option>';
                categories.forEach(cat => {
                    const opt = `<option value="${cat.id}">${cat.name}</option>`;
                    select.insertAdjacentHTML('beforeend', opt);
                });
            } catch (error) {
                console.error('Failed to load categories into selection form:', error);
            }
        }

        // Handle multipart form-data submit stream for product creation
        document.getElementById('createProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errorBox = document.getElementById('createError');
            
            const name = document.getElementById('createName').value;
            const categoryId = document.getElementById('createCategorySelect').value;
            const price = document.getElementById('createPrice').value;
            const description = document.getElementById('createDesc').value;
            const fileInput = document.getElementById('createImageFile');

            // Wrap payload elements using native FormData structure to allow binary streaming
            const formData = new FormData();
            formData.append('name', name);
            formData.append('category_id', categoryId);
            formData.append('price', price);
            formData.append('description', description);
            formData.append('image', fileInput.files[0]);

            try {
                // Route stream context over our custom non-JSON file uploader function
                await fetchUploadAPI('/admin/products', 'POST', formData);

                // Tear down modal view state on valid processing execution
                const modalEl = document.getElementById('createProductModal');
                const modalInstance = bootstrap.Modal.getInstance(modalEl);
                modalInstance.hide();
                this.reset();
                errorBox.classList.add('d-none');
                loadProducts(currentPage);
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.remove('d-none');
            }
        });

        // Open edit modal and pre-fill current product values
        async function openEditProduct(id, name, categoryId, price, description) {
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editPrice').value = price;
            document.getElementById('editDesc').value = description;
            document.getElementById('editImageFile').value = '';
            document.getElementById('editError').classList.add('d-none');

            // Populate category dropdown for edit modal
            const select = document.getElementById('editCategorySelect');
            try {
                const response = await fetchAPI('/categories?page=1&limit=100', 'GET');
                const categories = response.items || [];
                select.innerHTML = '<option value="">-- Select a Category --</option>';
                categories.forEach(cat => {
                    const opt = `<option value="${cat.id}" ${Number(cat.id) === Number(categoryId) ? 'selected' : ''}>${cat.name}</option>`;
                    select.insertAdjacentHTML('beforeend', opt);
                });
            } catch (error) {
                console.error('Failed to load categories:', error);
            }

            bootstrap.Modal.getOrCreateInstance(document.getElementById('editProductModal')).show();
        }

        // Handle edit form submit (multipart, image optional)
        document.getElementById('editProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const errorBox = document.getElementById('editError');

            const formData = new FormData();
            formData.append('name', document.getElementById('editName').value);
            formData.append('category_id', document.getElementById('editCategorySelect').value);
            formData.append('price', document.getElementById('editPrice').value);
            formData.append('description', document.getElementById('editDesc').value);
            const fileInput = document.getElementById('editImageFile');
            if (fileInput.files.length > 0) {
                formData.append('image', fileInput.files[0]);
            }

            try {
                await fetchUploadAPI(`/admin/products/${id}`, 'PUT', formData);
                bootstrap.Modal.getInstance(document.getElementById('editProductModal')).hide();
                errorBox.classList.add('d-none');
                loadProducts(currentPage);
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.remove('d-none');
            }
        });

        // Delete product record execution
        async function deleteProduct(id) {
            if (!confirm('Are you completely sure you want to delete this product?')) return;
            try {
                await fetchAPI(`/admin/products/${id}`, 'DELETE');
                loadProducts(currentPage);
            } catch (error) {
                alert('Deletion operation failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
